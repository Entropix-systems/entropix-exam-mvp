services:
  postgres:
    image: postgres:17-alpine
    container_name: entropix-exam-postgres

    ports:
      - "55432:5432"

    environment:
      POSTGRES_USER: exam_bootstrap
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD}
      POSTGRES_DB: postgres

      EXAM_MIGRATION_PASSWORD: ${EXAM_MIGRATION_PASSWORD}
      EXAM_APP_PASSWORD: ${EXAM_APP_PASSWORD}

    volumes:
      - exam_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U exam_bootstrap -d postgres"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

    restart: unless-stopped

volumes:
  exam_postgres_data:
