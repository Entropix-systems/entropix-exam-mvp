function studentTable(a){return table(['Student','Cohort','Subjects','Status'],a.map(s=>[nameCell(s),'Semester 3 · A','3 enrolled',badge('ACTIVE','green')]))}function filterStudents(q){document.getElementById('studentRows').innerHTML=studentTable(students.filter(s=>(s.name+s.id).toLowerCase().includes(q.toLowerCase())))}function outcome(s){if(s.id==='NS26006'&&state.hold)return{status:'WITHHELD',total:null,points:0};if(s.a==='ABSENT')return{status:'ABSENT',total:null,points:0};if(s.e===null)return{status:'INCOMPLETE',total:null,points:0};let t=s.i+s.e,fail=t<40||s.e/60*100<40;return{status:fail?'FAIL':'PASS',total:t,points:fail?0:t>=80?10:t>=60?8:6}}function gpa(s){let o=outcome(s);return(o.points*3+10*4+6*3)/10}function aggregate(s){let o=outcome(s);return o.total===null?null:(o.total+85+65)/3}
function importDialog(valid=false){modal('Import students · Preview',`<p class="sub">CSV/XLSX in the application. This mock uses a built-in sample.</p><div class="actions" style="margin:18px 0">${btn('Show sample with errors','closeModal();importDialog(false)')}${btn('Show corrected sample','closeModal();importDialog(true)')}</div>`+table(['Row','Roll number','Validation'],[['2','NS26008',badge('VALID','green')],['3',valid?'NS26009':'NS26001',badge(valid?'VALID':'DUPLICATE ROLL',valid?'green':'red')],['4','NS26010',badge(valid?'VALID':'UNKNOWN SUBJECT',valid?'green':'red')]])+`<p class="mini" style="margin-top:16px">${valid?'3 valid rows · 0 rejected. The mock verifies this sample without adding students to the exam.':'1 valid row · 2 rejected. Fix all errors before commit; no partial import.'}</p>`,btn('Cancel','closeModal()')+`<button class="btn primary" ${!valid?'disabled':''} onclick="state.imported=true;log('Import sample verified','3 valid rows · no cohort mutation');closeModal();render();toast('Sample import validated. The six-student exam fixture is unchanged.')">Confirm sample</button>`)}function examDialog(){modal('Edit exam name',`<label>Exam name<input id="examName" value="${esc(state.exam)}" maxlength="80"></label><p class="mini" style="margin-top:16px">Academic term, components and grading policy are frozen for this exam.</p>`,btn('Cancel','closeModal()')+btn('Save name','saveExamName()','primary'))}function saveExamName(){if(!requireRole(['Exam Controller']))return;let n=document.getElementById('examName').value.trim();if(!n)return toast('Enter an exam name.');state.exam=n;log('Exam name updated',n);closeModal();render()}function registrationDecision(s){if(!requireRole(['Exam Controller']))return;state.registration=s;log('Application '+s.toLowerCase(),'Illustrative NS26007 request');render();toast('Application example '+s.toLowerCase()+'.')}

function attendanceChange(i,v){if(state.published){toast('Withdraw publication before changing conduct data.');render();return}students[i].a=v;if(v==='ABSENT')students[i].e=null;invalidate();state.batch='DRAFT';log('Attendance changed',students[i].id+' · '+v);render()}function submitAttendance(){if(!requireRole(['Invigilator / Observer']))return;if(state.duty!=='ACCEPTED')return toast('Accept the duty before submitting attendance.');state.attendanceSubmitted=true;invalidate();log('Attendance submitted','CS301 · 6 students');render();toast('Attendance submitted and locked.')}function reasonDialog(t,handler){modal(t,`<label>Reason<textarea id="reason" rows="3" placeholder="Explain this change"></textarea></label>`,btn('Cancel','closeModal()')+btn('Confirm',handler,'primary'))}function getReason(){let r=document.getElementById('reason').value.trim();if(r.length<5){toast('Enter a reason of at least five characters.');return null}return r}function reopenAttendance(){if(!requireRole(['Exam Controller']))return;if(state.published)return toast('Withdraw results before reopening attendance.');reasonDialog('Reopen attendance','confirmAttendanceReopen()')}function confirmAttendanceReopen(){let r=getReason();if(!r)return;state.attendanceSubmitted=false;state.batch='DRAFT';invalidate();log('Attendance reopened',r);closeModal();render()}function incidentDialog(){modal('Report an incident',`<label>Student<select id="incidentStudent" class="field"><option>Rohan Das · NS26006</option></select></label><label style="margin-top:16px">Incident description<textarea id="reason" rows="3" placeholder="Describe the observed issue"></textarea></label>`,btn('Cancel','closeModal()')+btn('Save incident','saveIncident()','primary'))}function saveIncident(){if(!requireRole(['Invigilator / Observer','Exam Controller']))return;let r=getReason();if(!r)return;if(state.published)return toast('Withdraw publication before changing a result hold.');state.hold=true;invalidate();log('Student incident record function markChange(i,k,v){let n=v===''?null:Number(v),max=k==='i'?40:60;if(n===null&&k==='i'||n!==null&&(!Number.isFinite(n)||n<0||n>max)){toast('Enter a value from 0 to '+max+'.');render();return}students[i][k]=n;invalidate();render()}function submitMarks(){if(!requireRole(['Faculty / Examiner']))return;if(students.some(s=>s.a!=='ABSENT'&&s.e===null))return toast('Complete external marks for every attending student.');state.batch='SUBMITTED';invalidate();log('Marks submitted','CS301 · Faculty / Examiner');render();toast('Submitted. Switch to Exam Controller for independent review.')}function reviewMarks(ok){if(!requireRole(['Exam Controller','Department Admin']))return;if(state.batch!=='SUBMITTED')return toast('Only a submitted batch can be reviewed.');reasonDialog(ok?'Approve CS301 marks':'Return CS301 marks',ok?'confirmReview(true)':'confirmReview(false)')}function confirmReview(ok){let r=getReason();if(!r)return;state.batch=ok?'APPROVED':'RETURNED';invalidate();log(ok?'Marks independently approved':'Marks returned',r);closeModal();render()}function reopenMarks(){if(!requireRole(['Exam Controller']))return;if(state.published)return toast('Withdraw publication before reopening marks.');reasonDialog('Reopen approved marks','confirmReopenMarks()')}function confirmReopenMarks(){let r=getReason();if(!r)return;state.batch='DRAFT';invalidate();log('Marks reopened',r);closeModal();render()}
